<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF para PNG</title>
<style>
*{box-sizing:border-box}body{font:14px/1.5 Arial,Helvetica,sans-serif;margin:0;padding:12px;color:#263141;background:transparent}
main{max-width:1100px;margin:auto}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
label{display:inline-flex;gap:6px;align-items:center}input[type=file]{max-width:100%}
button,input[type=number]{font:inherit;padding:7px 10px;border:1px solid #b9c4d2;border-radius:5px;background:#fff;color:#263141}
button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:#215fa4;border-color:#215fa4;color:white}
output{display:block;min-height:22px;margin:10px 0;font-size:13px}small{color:#66717f}
.preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.page{border:1px solid #d3dbe3;border-radius:6px;padding:8px;min-width:0}.page img{display:block;max-width:100%;margin:8px auto;border:1px solid #ddd}
.page .info{font-size:12px;color:#526176}.page button{margin-top:7px}
</style>
</head>
<body>
<main>
<div class="bar"><label>PDF <input type="file" id="file" accept=".pdf,application/pdf"></label>
<label>Resolução <select id="scale"><option value="1.5">Normal (1,5×)</option><option value="2" selected>Alta (2×)</option><option value="3">Muito alta (3×)</option></select></label></div>
<div class="bar">
<label><input type="checkbox" id="crop" checked> Recortar espaço branco abaixo do conteúdo da última página</label>
<label>Margem inferior <input id="margin" type="number" min="0" max="1000" step="10" value="100" style="width:80px"> px</label>
<label><input id="allPages" type="checkbox" checked> Gerar todas as páginas</label>
</div>
<div class="bar"><button class="primary" id="convert">Converter em PNG</button><button id="downloadZip" disabled>Baixar todos em ZIP</button><button id="clear">Limpar</button></div>
<output id="status" role="status" aria-live="polite"></output>
<section class="preview" id="pages"></section>
<p><small>O PDF é processado no próprio navegador. Para funcionar offline, coloque <code>pdf.mjs</code> e <code>pdf.worker.mjs</code> da mesma versão do PDF.js na pasta <code>pdfjs/</code>, ao lado deste HTML. A margem é medida em pixels do PNG gerado. O recorte detecta pixels visíveis, inclusive rodapés e números de página.</small></p>
</main>
<script type="module">
const $=id=>document.getElementById(id);
const status=s=>{$('status').textContent=s;};
let generated=[], library=null, busy=false;
// PDF.js recente usa métodos Map/WeakMap ainda ausentes em alguns navegadores.
if (!Map.prototype.getOrInsertComputed) {
 Map.prototype.getOrInsertComputed=function(key,callback){
  if(this.has(key))return this.get(key);
  const value=callback(key);this.set(key,value);return value;
 };
}
if (!Map.prototype.getOrInsert) {
 Map.prototype.getOrInsert=function(key,defaultValue){
  if(this.has(key))return this.get(key);
  this.set(key,defaultValue);return defaultValue;
 };
}
for (const Collection of [Map, WeakMap]) {
 if (!Collection.prototype.getOrInsertComputed) {
  Collection.prototype.getOrInsertComputed=function(key,callback){
   if(this.has(key))return this.get(key);
   const value=callback(key);this.set(key,value);return value;
  };
 }
 if (!Collection.prototype.getOrInsert) {
  Collection.prototype.getOrInsert=function(key,value){
   if(this.has(key))return this.get(key);
   this.set(key,value);return value;
  };
 }
}
function release(){
 for(const item of generated)URL.revokeObjectURL(item.url);
 generated=[]; $('pages').replaceChildren(); $('downloadZip').disabled=true;
}
async function loadPdfJs(){
 if(library)return library;
 try{
  library=await import('./pdfjs/pdf.mjs');
  library.GlobalWorkerOptions.workerSrc=new URL('./pdfjs/worker_compat.mjs',import.meta.url).href;
  return library;
 }catch(err){throw new Error('Biblioteca PDF.js não encontrada. Instale pdfjs/pdf.mjs e pdfjs/pdf.worker.mjs, da mesma versão, ao lado deste HTML. Detalhe: '+err.message);}
}
function bottomContentRow(canvas){
 const {width:w,height:h}=canvas;const context=canvas.getContext('2d',{willReadFrequently:true});
 const stride=2,block=256;
 for(let end=h;end>0;end-=block){
  const top=Math.max(0,end-block),data=context.getImageData(0,top,w,end-top).data;
  for(let y=end-top-1;y>=0;y--){
   for(let x=0;x<w;x+=stride){
    const k=(y*w+x)*4,a=data[k+3];
    if(a>24&&(data[k]<242||data[k+1]<242||data[k+2]<242))return top+y;
   }
  }
 }
 return -1;
}
function canvasBlob(canvas){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Não foi possível criar o PNG.')),'image/png'));}
function download(blob,name){
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;
 document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
}
async function copyPng(blob) {
 if (!navigator.clipboard?.write || typeof ClipboardItem === 'undefined') {
  throw new Error('Seu navegador não permite copiar imagens neste contexto. Abra a ferramenta por HTTPS (GitHub Pages) ou localhost.');
 }
 await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
}
function nameSafe(name){return name.replace(/\.pdf$/i,'').replace(/[^\p{L}\p{N}._-]+/gu,'_').slice(0,90)||'documento';}
async function convert(){
 if(busy)return;
 const file=$('file').files?.[0];if(!file){status('Selecione um PDF.');return;}
 busy=true;$('convert').disabled=true;$('downloadZip').disabled=true;release();
 let doc;
 try{
  const pdfjs=await loadPdfJs(),bytes=new Uint8Array(await file.arrayBuffer());
  doc=await pdfjs.getDocument({data:bytes}).promise;
  const total=$('allPages').checked?doc.numPages:1;
  const scale=Number($('scale').value),margin=Math.max(0,Math.min(1000,Number($('margin').value)||0));
  const base=nameSafe(file.name);
  for(let i=1;i<=total;i++){
   status('Convertendo página '+i+' de '+total+'...');
   await new Promise(r=>requestAnimationFrame(r));
   const page=await doc.getPage(i),viewport=page.getViewport({scale});
   const canvas=document.createElement('canvas');
   canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
   if(canvas.width*canvas.height>30000000)throw new Error('A página excede o limite de 30 milhões de pixels. Reduza a resolução.');
   const ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
   await page.render({canvasContext:ctx,viewport}).promise;
   let final=canvas,trimmed=0;
   if($('crop').checked && i===doc.numPages){
    const last=bottomContentRow(canvas);
    if(last>=0){
     const newHeight=Math.min(canvas.height,Math.max(1,last+1+margin));
     trimmed=canvas.height-newHeight;
     if(trimmed>0){
      final=document.createElement('canvas');final.width=canvas.width;final.height=newHeight;
      final.getContext('2d').drawImage(canvas,0,0,canvas.width,newHeight,0,0,canvas.width,newHeight);
     }
    }
   }
   const blob=await canvasBlob(final),filename=base+'_pagina_'+String(i).padStart(3,'0')+'.png';
   const url=URL.createObjectURL(blob);generated.push({blob,name:filename,url});
   const card=document.createElement('article');card.className='page';
   const title=document.createElement('strong');title.textContent='Página '+i;
   const info=document.createElement('div');info.className='info';
   info.textContent=final.width+' × '+final.height+' px'+(trimmed?' • '+trimmed+' px recortados':'');
   const img=document.createElement('img');img.src=url;img.alt='Prévia da página '+i;img.loading='lazy';
   const btn=document.createElement('button');btn.textContent='Baixar PNG';btn.onclick=()=>download(blob,filename);
   const copyBtn=document.createElement('button');
   copyBtn.textContent='Copiar imagem (Ctrl+C)';
   copyBtn.style.marginLeft='7px';
   copyBtn.onclick=async()=>{
    try{
     await copyPng(blob);
     status('Imagem da página '+i+' copiada. Use Ctrl+V para colar.');
    }catch(e){status('Não foi possível copiar a imagem: '+e.message);}
   };
   card.append(title,info,img,btn,copyBtn);$('pages').append(card);
   page.cleanup();
  }
  $('downloadZip').disabled=false;
  status(generated.length+' página(s) convertida(s). Os PNGs podem ser baixados individualmente ou em ZIP.');
 }catch(err){status('Erro: '+(err?.message||String(err)));}finally{
  try{await doc?.destroy();}catch{}busy=false;$('convert').disabled=false;
 }
}
// ZIP sem dependências externas (entradas STORE/sem compactação, pois PNG já é comprimido).
const te=new TextEncoder();
const crcTable=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;return c>>>0;});
function crc32(data){let c=0xffffffff;for(const b of data)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0;}
function zipFiles(files){
 const parts=[],central=[];let offset=0;
 function header(n){const a=new Uint8Array(n);return{a,v:new DataView(a.buffer)};}
 for(const f of files){
  const name=te.encode(f.name),data=f.data,crc=crc32(data);
  const h=header(30+name.length),v=h.v;
  v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);
  v.setUint16(8,0,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);
  v.setUint16(26,name.length,true);h.a.set(name,30);parts.push(h.a,data);
  const c=header(46+name.length),cv=c.v;
  cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
  cv.setUint16(8,0x0800,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);
  cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);
  c.a.set(name,46);central.push(c.a);offset+=h.a.length+data.length;
 }
 const size=central.reduce((n,c)=>n+c.length,0),end=header(22),v=end.v;
 v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);
 v.setUint32(12,size,true);v.setUint32(16,offset,true);
 return new Blob([...parts,...central,end.a],{type:'application/zip'});
}
$('convert').onclick=convert;
$('downloadZip').onclick=async()=>{
 if(!generated.length||busy)return;
 try{
  status('Preparando ZIP...');
  const files=[];
  for(const f of generated)files.push({name:f.name,data:new Uint8Array(await f.blob.arrayBuffer())});
  const zip=zipFiles(files);download(zip,nameSafe($('file').files[0]?.name||'documento')+'_png.zip');status('Arquivo ZIP gerado.');
 }catch(e){status('Erro ao gerar ZIP: '+e.message);}
};
$('clear').onclick=()=>{$('file').value='';release();status('');};
</script>
</body></html>
